[package]
name = "ai-gemini"
version = "0.1.0"
edition = "2021"
description = "Gemini API adapter for AI Flow platform RouterLLM and ResponseLLM traits"

[dependencies]
ai-router-engine = { path = "../ai-router-engine" }
ai-response-engine = { path = "../ai-response-engine" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
