[package]
name = "ai-prompts"
version = "0.1.0"
edition = "2021"
description = "Prompt management: registry, templates, identity, placeholder rendering"

[dependencies]
ai-router-engine = { path = "../ai-router-engine" }
ai-response-engine = { path = "../ai-response-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
